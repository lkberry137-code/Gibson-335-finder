<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="cherryBurst" cx="50%" cy="58%" r="55%">
      <stop offset="0%" stop-color="#E6323B" />
      <stop offset="55%" stop-color="#B0151D" />
      <stop offset="100%" stop-color="#5E080D" />
    </radialGradient>
  </defs>

  <!-- Dark Espresso Rounded Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#14100E" stroke="#E59A28" stroke-width="2" />

  <!-- 3+3 Vintage Gold Tuner Pegs -->
  <g fill="#E59A28">
    <circle cx="25.2" cy="6.6" r="1.15" />
    <circle cx="25.2" cy="9.0" r="1.15" />
    <circle cx="25.2" cy="11.4" r="1.15" />
    <circle cx="38.8" cy="6.6" r="1.15" />
    <circle cx="38.8" cy="9.0" r="1.15" />
    <circle cx="38.8" cy="11.4" r="1.15" />
  </g>

  <!-- ES-335 Double-Cutaway Sixties Cherry Body with Cream Binding -->
  <path
    d="M 29.0 32.0
       C 27.2 26.8, 22.8 25.0, 20.4 26.8
       C 18.2 28.5, 19.2 33.8, 21.4 37.0
       C 17.6 39.6, 14.0 43.2, 14.2 49.0
       C 14.4 55.2, 20.8 58.6, 32.0 58.6
       C 43.2 58.6, 49.6 55.2, 49.8 49.0
       C 50.0 43.2, 46.4 39.6, 42.6 37.0
       C 44.8 33.8, 45.8 28.5, 43.6 26.8
       C 41.2 25.0, 36.8 26.8, 35.0 32.0 Z"
    fill="url(#cherryBurst)"
    stroke="#F5E6C8"
    stroke-width="1.6"
    stroke-linejoin="round"
  />

  <!-- Symmetrical F-Holes -->
  <path
    d="M 22.5 40.8 C 20.6 42.0, 19.6 45.4, 20.6 49.0 C 21.1 50.8, 20.2 52.0, 19.0 51.6"
    fill="none"
    stroke="#120B09"
    stroke-width="2.1"
    stroke-linecap="round"
  />
  <path
    d="M 41.5 40.8 C 43.4 42.0, 44.4 45.4, 43.4 49.0 C 42.9 50.8, 43.8 52.0, 45.0 51.6"
    fill="none"
    stroke="#120B09"
    stroke-width="2.1"
    stroke-linecap="round"
  />

  <!-- Gibson Open-Book Headstock -->
  <path
    d="M 28.4 13.0 L 27.0 5.4 Q 29.6 3.8 32.0 5.4 Q 34.4 3.8 37.0 5.4 L 35.6 13.0 Z"
    fill="#1B130F"
    stroke="#E59A28"
    stroke-width="0.9"
    stroke-linejoin="round"
  />

  <!-- Rosewood Fretboard & Dot Inlays -->
  <rect x="29.5" y="13.0" width="5.0" height="20.6" rx="0.6" fill="#2B1912" stroke="#F5E6C8" stroke-width="0.45" />
  <circle cx="32" cy="18.2" r="0.7" fill="#F5E6C8" />
  <circle cx="32" cy="23.4" r="0.7" fill="#F5E6C8" />
  <circle cx="32" cy="28.6" r="0.7" fill="#F5E6C8" />

  <!-- Dual PAF Humbuckers, Tune-O-Matic Bridge & Stopbar Tailpiece -->
  <rect x="27.2" y="34.8" width="9.6" height="4.2" rx="0.8" fill="#E59A28" stroke="#14100E" stroke-width="0.6" />
  <rect x="27.0" y="42.4" width="10.0" height="4.4" rx="0.8" fill="#E59A28" stroke="#14100E" stroke-width="0.6" />
  <rect x="27.5" y="48.8" width="9.0" height="1.8" rx="0.6" fill="#F3D08B" />
  <rect x="28.0" y="52.4" width="8.0" height="2.0" rx="0.7" fill="#E59A28" />
